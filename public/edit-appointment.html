<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>Medical Appointment Scheduler</h1>

    <div class="header-right">
        <span>Patient</span>
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>
</header>

<main class="appointment-container">
    <h2>Edit Appointment</h2>
    <p class="description">Update your appointment details.</p>

    <form id="editAppointmentForm">

        <div class="form-group">
            <label for="doctor">Doctor</label>
            <select id="doctor" required>
                <option value="">Select Doctor</option>
                <option value="Dr. Sarah Lee">Dr. Sarah Lee</option>
                <option value="Dr. James Wilson">Dr. James Wilson</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="time">Time</label>
            <select id="time" required>
                <option value="">Select Time</option>
                <option value="09:00">9:00 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="14:00">2:00 PM</option>
            </select>
        </div>

        <p id="editError" class="error-message"></p>

        <button type="submit">Save Changes</button>

        <button
            type="button"
            class="secondary-button"
            onclick="window.location.href='/my-appointments.html'">
            Back
        </button>

    </form>
</main>

<script src="/js/logout.js"></script>
<script src="/js/auth.js"></script>
<script>
    checkAuth('patient');
</script>
<script src="/js/edit-appointment.js"></script>

</body>
</html>
