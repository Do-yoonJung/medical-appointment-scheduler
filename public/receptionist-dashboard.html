<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>Medical Appointment Scheduler</h1>

    <div class="header-right">
        <span>Receptionist</span>
        <button class="logout-button" onclick="logout()">
            Logout
        </button>
    </div>
</header>

<main class="dashboard-container">
    <h2>Receptionist Dashboard</h2>
    <p class="description">Manage patient appointments.</p>

    <div class="dashboard-cards">

        <div class="dashboard-card">
            <h3>Manage Appointments</h3>
            <p>View and manage patient appointments.</p>
            <a href="/manage-appointments.html">Manage Appointments</a>
        </div>

        <div class="dashboard-card">
            <h3>Create Appointment</h3>
            <p>Schedule a new appointment for a patient.</p>
            <a href="/receptionist-create-appointment.html">
                Create Appointment
            </a>
        </div>

    </div>
</main>
<script src="/js/logout.js"></script>
<script src="/js/auth.js"></script>
<script>checkAuth('receptionist');</script>
</body>
</html>
